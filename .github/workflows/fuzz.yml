name: fuzz

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-15 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Fixed-seed smoke, every target
        # The prebuilt cargo-fuzz is linked against musl and takes its default
        # target from its own build, so the target is named here: the sanitizer
        # needs the gnu libc.
        run: |
          for target in $(cargo +nightly-2026-10-15 fuzz list); do
            cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu "$target" -- -runs=10000 -seed=1 -max_len=16384
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
