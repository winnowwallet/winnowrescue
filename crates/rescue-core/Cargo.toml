[package]
name = "rescue-core"
description = "The pure core of Winnow Rescue: derivation plans, coin proofs, the sweep and its checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Entry points shared by the fuzz targets and the regression replay.
fuzzing = ["dep:serde_json"]

[dependencies]
bitcoin.workspace = true
bip39.workspace = true
zeroize.workspace = true
static_assertions.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
# Discovery's saved progress is public data and is written and read with serde;
# the secret types are asserted not to be Serialize.
serde.workspace = true
# Only the fuzz entry point that reads a saved run from JSON.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true

[lints]
workspace = true
